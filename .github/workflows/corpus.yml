name: ci

# One run per change: pushes to main, and pull requests (a branch push alone
# would duplicate the pull-request run, including the multi-hour LLVM build).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus format and error offsets
        run: python3 tools/corpus.py check
      - name: Check spec/pegasus.ebnf is in sync with spec/grammar.md
        run: python3 tools/extract_ebnf.py --check spec/grammar.md
      - name: Test golden review and freeze safeguards
        run: python3 tools/test_goldens.py
      - name: Check frozen source cases and goldens are unchanged
        run: python3 tools/goldens.py check
      - name: Check production coverage matrix against spec/pegasus.ebnf
        run: python3 tools/corpus.py coverage
      - name: Test the LLVM pin enforcement (fake clangs)
        run: python3 tools/test_check_toolchain.py
      - name: Test the toolchain package path (pack, record, fetch, safe unpack)
        run: python3 tools/test_toolchain_packages.py
      - name: Verify corpus and golden bytes survived checkout (CR LF, lone CR, BOM, invalid UTF-8)
        run: python3 tools/check_checkout.py

  build-and-test:
    # The Linux toolchain package is built on Ubuntu 24.04 (glibc 2.39); run
    # where it runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      # The prebuilt package pinned in toolchain-packages.lock.json (built by
      # .github/workflows/toolchain.yml): part and archive SHA-256, build
      # provenance, safe unpack, then version/commit/stamp/binary-hash.
      - name: Cache the verified package download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-download
          key: llvm-package-linux-x86_64-${{ hashFiles('toolchain-packages.lock.json') }}
      - name: Fetch and verify the pinned LLVM/MLIR package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/fetch_llvm_package.py --platform linux-x86_64 --dest "${{ runner.temp }}/llvm" --download-dir "${{ runner.temp }}/llvm-download"
      - name: Package-consumer smoke test (clang, MLIR tools, MLIR CMake package, lowering)
        run: python3 tools/package_llvm.py smoke --prefix "${{ runner.temp }}/llvm" --work "${{ runner.temp }}/smoke"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPEGASUS_LLVM_ROOT="${{ runner.temp }}/llvm"
      - name: Build
        run: cmake --build build
      - name: Test (unit and parser tests, grammar sync, corpus format, coverage, frozen goldens, conformance)
        run: ctest --test-dir build --output-on-failure
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check

  # Windows, checked out with core.autocrlf=true: the setting that rewrote the
  # goldens to CR LF in R6.1. .gitattributes must keep every byte-sensitive file
  # exact, and the whole suite must pass on a second OS and file system.
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    # PowerShell by default: in Git Bash, /usr/bin/link (coreutils) shadows
    # MSVC's link.exe, and rustc then calls it (first CI run: "link: extra
    # operand"). Steps that need bash syntax say so.
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Use autocrlf=true, the Windows default that broke R6.1
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify corpus and golden bytes survived checkout
        run: python tools/check_checkout.py
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Ninja
        run: python -m pip install ninja
      - name: MSVC developer environment (compiler and linker for LLVM and the backend)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Cache the verified package download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-download
          key: llvm-package-windows-x86_64-${{ hashFiles('toolchain-packages.lock.json') }}
      - name: Fetch and verify the pinned LLVM/MLIR package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/fetch_llvm_package.py --platform windows-x86_64 --dest "${{ runner.temp }}/llvm" --download-dir "${{ runner.temp }}/llvm-download"
      - name: Package-consumer smoke test (clang, MLIR tools, MLIR CMake package, lowering)
        run: python tools/package_llvm.py smoke --prefix "${{ runner.temp }}/llvm" --work "${{ runner.temp }}/smoke"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DPEGASUS_LLVM_ROOT="${{ runner.temp }}/llvm"
      - name: Build
        run: cmake --build build
      - name: Test (same suite as Linux)
        run: ctest --test-dir build --output-on-failure
