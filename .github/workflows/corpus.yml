name: ci

# One run per change: pushes to main, and pull requests (a branch push alone
# would duplicate the pull-request run, including the multi-hour LLVM build).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate corpus format and error offsets
        run: python3 tools/corpus.py check
      - name: Check spec/pegasus.ebnf is in sync with spec/grammar.md
        run: python3 tools/extract_ebnf.py --check spec/grammar.md
      - name: Test golden review and freeze safeguards
        run: python3 tools/test_goldens.py
      - name: Check frozen source cases and goldens are unchanged
        run: python3 tools/goldens.py check
      - name: Check production coverage matrix against spec/pegasus.ebnf
        run: python3 tools/corpus.py coverage
      - name: Test the LLVM pin enforcement (fake clangs)
        run: python3 tools/test_check_toolchain.py
      - name: Verify corpus and golden bytes survived checkout (CR LF, lone CR, BOM, invalid UTF-8)
        run: python3 tools/check_checkout.py

  build-and-test:
    # Pinned image, not ubuntu-latest: the pinned LLVM 18.1.3 does not
    # compile with GCC 15 (ubuntu-26.04: missing <cstdint> in
    # llvm/ADT/SmallVector.h). Ubuntu 24.04's GCC 13.3 builds it.
    runs-on: ubuntu-24.04
    # The first run builds clang + MLIR from the pinned commit (cached after).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake
      - name: Host compilers used to build LLVM
        run: gcc --version | head -1 && g++ --version | head -1 && cmake --version | head -1
      - name: Restore the pinned LLVM (toolchain.lock)
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('toolchain.lock', 'tools/provision_llvm.py', 'tools/toolchain_lock.py') }}
      - name: Provision the pinned LLVM (verified commit; clang + MLIR; stamped)
        if: steps.llvm.outputs.cache-hit != 'true'
        run: python3 tools/provision_llvm.py --prefix "${{ runner.temp }}/llvm" --jobs 4
      # Saved as soon as it is built, so a later failure (the backend tests)
      # does not throw away hours of LLVM build.
      - name: Save the pinned LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      - name: Enforce the pin (version, commit, stamp, clang binary hash)
        run: python3 tools/check_toolchain.py "${{ runner.temp }}/llvm/bin/clang" --require-stamp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPEGASUS_LLVM_ROOT="${{ runner.temp }}/llvm"
      - name: Build
        run: cmake --build build
      - name: Test (unit and parser tests, grammar sync, corpus format, coverage, frozen goldens, conformance)
        run: ctest --test-dir build --output-on-failure
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings && cargo fmt --check

  # Windows, checked out with core.autocrlf=true: the setting that rewrote the
  # goldens to CR LF in R6.1. .gitattributes must keep every byte-sensitive file
  # exact, and the whole suite must pass on a second OS and file system.
  windows:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Use autocrlf=true, the Windows default that broke R6.1
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify corpus and golden bytes survived checkout
        run: python tools/check_checkout.py
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Ninja
        run: python -m pip install ninja
      - name: MSVC developer environment (compiler and linker for LLVM and the backend)
        uses: ilammy/msvc-dev-cmd@v1
      - name: Host compilers used to build LLVM
        run: cl 2>&1 | head -1; cmake --version | head -1
      - name: Restore the pinned LLVM (toolchain.lock)
        id: llvm
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ runner.os }}-${{ hashFiles('toolchain.lock', 'tools/provision_llvm.py', 'tools/toolchain_lock.py') }}
      - name: Provision the pinned LLVM (verified commit; clang + MLIR; stamped)
        if: steps.llvm.outputs.cache-hit != 'true'
        # PowerShell, so Git Bash's /usr/bin/link cannot shadow MSVC's link.exe.
        shell: pwsh
        run: python tools/provision_llvm.py --prefix "${{ runner.temp }}/llvm" --jobs 4
      - name: Save the pinned LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      - name: Enforce the pin (version, commit, stamp, clang binary hash)
        run: python tools/check_toolchain.py "${{ runner.temp }}/llvm/bin/clang.exe" --require-stamp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DPEGASUS_LLVM_ROOT="${{ runner.temp }}/llvm"
      - name: Build
        run: cmake --build build
      - name: Test (same suite as Linux)
        run: ctest --test-dir build --output-on-failure
