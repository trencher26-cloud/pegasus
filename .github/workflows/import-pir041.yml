name: Import Pegasus PIR0.4.1 and run platform CI

on:
  push:
    branches: [main]
    paths:
      - "pegasus-pir0.4.1.zip"
      - ".github/workflows/import-pir041.yml"

permissions:
  contents: write

jobs:
  import:
    name: Verify archive and import source tree
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the uploaded archive
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/trencher26-cloud/pegasus/main/pegasus-pir0.4.1.zip \
            --output pegasus-pir0.4.1.zip

      - name: Verify archive fingerprint and safely extract project
        env:
          EXPECTED_SHA256: 72b2823236a27fecea53553a3b291525e45fe0985800d98d5c1d649f9e0e0415
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("pegasus-pir0.4.1.zip")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_SHA256"]
          if digest != expected:
              raise SystemExit(f"SHA-256 mismatch: {digest}")

          staging = Path(".import-staging")
          shutil.rmtree(staging, ignore_errors=True)
          staging.mkdir()
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe archive path: {info.filename}")
                  if not name.parts or name.parts[0] != "pegasus":
                      raise SystemExit(f"Unexpected archive root: {info.filename}")
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not permitted in import: {info.filename}")
              zf.extractall(staging)

          source = staging / "pegasus"
          if not source.is_dir():
              raise SystemExit("Expected top-level pegasus/ directory")

          def ignore(directory, names):
              ignored = {n for n in names if n == "__pycache__" or n.endswith((".pyc", ".pyo"))}
              if Path(directory).as_posix().endswith("/.github/workflows"):
                  ignored.add("corpus.yml")
              return ignored

          shutil.copytree(source, Path("."), dirs_exist_ok=True, ignore=ignore)
          archive.unlink()
          shutil.rmtree(staging)
          print(f"Imported source tree; archive SHA-256 verified: {digest}")
          PY

      - name: Commit actual source tree (preserve the active importer workflow)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Import verified Pegasus PIR0.4.1 source tree"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux — pinned LLVM/MLIR, build and test
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.source_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain and components
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.97.1

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Restore pinned LLVM and MLIR
        id: llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ runner.os }}-${{ hashFiles('toolchain.lock', 'tools/provision_llvm.py', 'tools/toolchain_lock.py') }}

      - name: Provision pinned LLVM and MLIR from exact source commit
        if: steps.llvm.outputs.cache-hit != 'true'
        run: python3 tools/provision_llvm.py --prefix "${{ runner.temp }}/llvm" --jobs 4

      - name: Enforce LLVM version, commit, stamp and binary hash
        run: python3 tools/check_toolchain.py "${{ runner.temp }}/llvm/bin/clang" --require-stamp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DPEGASUS_LLVM_ROOT="${{ runner.temp }}/llvm"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Clippy and formatting
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo fmt --check

  windows:
    name: Windows — pinned LLVM/MLIR, build and test
    needs: import
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Use autocrlf=true
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import.outputs.source_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain and components
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.97.1

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore pinned LLVM and MLIR
        id: llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-${{ runner.os }}-${{ hashFiles('toolchain.lock', 'tools/provision_llvm.py', 'tools/toolchain_lock.py') }}

      - name: Provision pinned LLVM and MLIR from exact source commit
        if: steps.llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: python tools/provision_llvm.py --prefix "${{ runner.temp }}/llvm" --jobs 4

      - name: Enforce LLVM version, commit, stamp and binary hash
        run: python tools/check_toolchain.py "${{ runner.temp }}/llvm/bin/clang.exe" --require-stamp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" -DPEGASUS_LLVM_ROOT="${{ runner.temp }}/llvm"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Clippy and formatting
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo fmt --check
