# Grammar production -> conformance case matrix (corpus v0.1.6, grammar v0.1.2-draft).
#
# [lexical] and [syntax] must hold exactly the productions of spec/pegasus.ebnf:
# `python3 tools/corpus.py coverage` fails on any production missing here, any
# entry that is not a production, any unknown case ID, any production without
# cases, and any case mapped nowhere. [filter] (newline-filter rules, which are
# prose in grammar section 3), [categories] and [rules] are not productions.
# Entries below target are reported without failing.
#
# Keys are production names exactly as written in the grammar. When a production
# is added to or removed from the grammar, update this file in the same change.

[targets]           # minimum cases per entry; the grammar's own goal for rules is 10
lexical    = 3
filter     = 3
syntax     = 2
categories = 2
rules      = 10

[lexical]           # grammar section 2
WHITESPACE    = ["P0-001", "L-012"]
NEWLINE       = ["N-003", "L-014", "N-015"]
